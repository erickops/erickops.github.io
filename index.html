<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kucingku Daily Checklist</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fff0f5, #f0e6ff);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      color: #333;
    }
    
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    
    header {
      background: linear-gradient(90deg, #ff8fab, #c8a2c8);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }
    
    .title { 
      font-size: 1.85rem; 
      font-weight: 600; 
      margin-bottom: 5px;
    }
    
    .list { padding: 20px; }
    
    .cat-item {
      display: flex;
      align-items: center;
      padding: 16px 18px;
      background: #fff;
      margin-bottom: 12px;
      border-radius: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      font-size: 1.15rem;
    }
    
    .cat-item input[type="checkbox"] {
      width: 26px;
      height: 26px;
      margin-right: 16px;
      accent-color: #ff8fab;
      cursor: pointer;
    }
    
    .cat-name { flex: 1; }
    
    .checked .cat-name {
      text-decoration: line-through;
      opacity: 0.65;
    }
    
    .progress {
      text-align: center;
      margin: 15px 0 20px;
      font-size: 1.2rem;
      color: #555;
      font-weight: 500;
    }
    
    .reset-btn {
      background: #ff8fab;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 50px;
      font-size: 1.05rem;
      display: block;
      margin: 20px auto 15px;
      cursor: pointer;
    }
    
    .datetime-bottom {
      text-align: center;
      padding: 0 20px 20px;
      color: #666;
      line-height: 1.6;
    }
    
    .date { 
      font-size: 1.05rem; 
    }
    
    .time {
      font-size: 1.35rem;
      font-weight: 600;
      color: #ff8fab;
    }
    
    .footer {
      text-align: center;
      padding: 15px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title">🐱 Kucingku Daily</div>
    </header>
    
    <div class="list" id="catList"></div>
    
    <div class="progress">
      Sudah dicek: <span id="progress">0</span> / 20
    </div>
    
    <button class="reset-btn" onclick="resetAll()">Reset Semua Checklist</button>
    
    <!-- Tanggal, Hari, dan Waktu WIB (24 jam) -->
    <div class="datetime-bottom">
      <div class="date" id="dateDisplay"></div>
      <div class="time" id="timeDisplay"></div>
    </div>
    
    <div class="footer">
      Dibuat khusus buat Ricko ❤️<br>
      Centang bebas • Data hilang jika refresh halaman
    </div>
  </div>

  <script>
    const cats = ["Sipit","Cakep","Koala","Kancil","Jeki","Bolu","Cici","Kribo","Caca","Abel","Luna","Oreo","Omi","Ndut","Gray","Kiko","Mimi","Oyen","Umis","Loki"];

    const catList = document.getElementById('catList');
    const dateDisplay = document.getElementById('dateDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressEl = document.getElementById('progress');

    let checked = new Set();

    function updateDateTime() {
      const now = new Date();
      
      // Format Tanggal & Hari (Bahasa Indonesia)
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      dateDisplay.textContent = now.toLocaleDateString('id-ID', dateOptions);
      
      // Format Waktu 24 jam WIB
      let hours = now.getHours().toString().padStart(2, '0');
      let minutes = now.getMinutes().toString().padStart(2, '0');
      timeDisplay.textContent = `${hours}:${minutes} WIB`;
    }

    function renderList() {
      catList.innerHTML = '';
      let count = 0;

      cats.forEach(cat => {
        const isChecked = checked.has(cat);
        
        const div = document.createElement('div');
        div.className = `cat-item ${isChecked ? 'checked' : ''}`;
        div.innerHTML = `
          <input type="checkbox" ${isChecked ? 'checked' : ''} 
                 onchange="toggle('${cat}', this.checked)">
          <span class="cat-name">🐾 ${cat}</span>
        `;
        catList.appendChild(div);
        
        if (isChecked) count++;
      });
      
      progressEl.textContent = count;
    }

    window.toggle = function(catName, isChecked) {
      if (isChecked) {
        checked.add(catName);
      } else {
        checked.delete(catName);
      }
      renderList();
    };

    window.resetAll = function() {
      if (confirm("Reset semua checklist hari ini?")) {
        checked.clear();
        renderList();
      }
    };

    // Inisialisasi
    updateDateTime();
    renderList();

    // Update waktu setiap 10 detik
    setInterval(updateDateTime, 10000);
  </script>
</body>
</html>
